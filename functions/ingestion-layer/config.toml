[global]
runtime = "deno"
entrypoint = "index.ts"

[global.environment]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""

[[global.headers]]
name = "Access-Control-Allow-Origin"
value = "*"

[[global.headers]]
name = "Access-Control-Allow-Methods"
value = "POST, OPTIONS"

[[global.headers]]
name = "Access-Control-Allow-Headers"
value = "authorization, x-client-info, apikey, content-type" 